{{NEW_HEAD}}
<link rel="canonical" href="https://ritza.app/new/">
<style>
{{SHARED_CSS}}
html { scroll-padding-top: 88px; }
[hidden] { display: none !important; }
.release-wrap { max-width: 820px; padding-block: 40px 64px; }
.release { padding-block-end: 40px; }
.release + .release { border-top: 1px solid var(--line); padding-block-start: 32px; }
.release-meta { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
h1, .release > h2 { font-size: clamp(30px, 5vw, 46px); line-height: 1.15; letter-spacing: -.025em; margin: 0 0 20px; text-wrap: balance; }
.release-intro { color: var(--ink-2); font-size: 18px; margin: 0 0 24px; }
.release-contents { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 36px; font-size: 14px; }
.release-contents a { display: inline-flex; align-items: center; min-height: 44px; max-width: 100%; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; }
.release-category { margin-block: 36px; padding-block-start: 8px; border-top: 1px solid var(--line); }
.release-category > h2, .release-category > h3[id] { font-size: 25px; line-height: 1.3; margin: 24px 0; }
.release-category > h3:not([id]), .release-category > h4 { font-size: 18px; line-height: 1.4; margin: 28px 0 12px; }
ul { padding-inline-start: 24px; margin-block: 12px 24px; }
li { margin-block: 12px; }
main a:focus-visible, footer a:focus-visible { outline: 3px solid var(--run); outline-offset: 3px; }
.back-top { display: inline-block; padding-block: 12px; color: var(--ink-2); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; padding-block: 28px; }
footer .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
footer a { text-decoration: none; }
footer a:hover { color: var(--ink); text-decoration: underline; }
footer .note { flex-basis: 100%; }
bdi { unicode-bidi: isolate; }
@media (max-width: 600px) { .release-wrap { padding-block-start: 28px; } .release-intro { font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
{{NEW_HEADER}}
<main class="wrap release-wrap" id="top">
<!-- New releases are prepended in i18n.json; earlier releases remain below them. -->
{{NEW_RELEASES}}
</main>
{{NEW_FOOTER}}
<script>
const T = {{NEW_TRANSLATIONS}};
function apply(lang) {
  if (!T[lang]) lang = "ru";
  const d = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.title = d.title;
  document.querySelector('meta[name="description"]').content = d.description;
  document.querySelector('meta[property="og:title"]').content = d.title;
  document.querySelector('meta[property="og:description"]').content = d.description;
  document.querySelectorAll('[data-release-language]').forEach(section => { section.hidden = section.lang !== lang; });
  document.querySelectorAll('[data-t]').forEach(el => { if (d[el.dataset.t]) el.textContent = d[el.dataset.t]; });
  document.querySelectorAll('#lang button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === lang)));
  document.getElementById('lang').setAttribute('aria-label', d.lang_label);
  const brandName = lang === "he" ? "ריצה" : lang === "en" ? "Ritza" : "Рица";
  document.querySelector('.brand').setAttribute('aria-label', brandName);
  document.querySelector('.brand').href = '/#' + lang;
  document.getElementById('wm-light').src = '/img/wordmark-' + lang + '.svg';
  document.getElementById('wm-dark').src = '/img/wordmark-' + lang + '-dark.svg';
  document.getElementById('wm-light').alt = brandName;
  document.getElementById('wm-dark').alt = brandName;
  try { localStorage.setItem('ritza-lang', lang); } catch (e) {}
}
document.querySelectorAll('#lang button').forEach(button => button.addEventListener('click', () => {
  apply(button.dataset.lang);
  history.replaceState(null, '', '#' + button.dataset.lang);
}));
function hashLanguage() { return location.hash.slice(1).split('-')[0]; }
window.addEventListener('hashchange', () => { const lang = hashLanguage(); if (T[lang]) apply(lang); });
let start = hashLanguage();
if (!T[start]) { try { start = localStorage.getItem('ritza-lang'); } catch (e) {} }
if (!T[start]) { const n = (navigator.language || 'ru').toLowerCase(); start = n.startsWith('he') || n.startsWith('iw') ? 'he' : n.startsWith('ru') ? 'ru' : 'en'; }
apply(start);
</script>
</body>
</html>
